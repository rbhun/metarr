# Default: bind the host media path. This only attaches /mnt/media into Docker.
# It does not copy or own library files. deploy.sh may rewrite this file to use
# a separate media_nfs volume (direct NFS) without deleting any volume or path.
volumes:
  media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /mnt/media
