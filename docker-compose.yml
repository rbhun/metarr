services:
  metarr:
    build: .
    ports:
      - "4317:4317"
    environment:
      PORT: "4317"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /app/data/library.db
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Same idea as PUID/PGID on other containers. Set in /opt/metarr/.env.
      METARR_UID: "${METARR_UID:-0}"
      METARR_GID: "${METARR_GID:-0}"
    volumes:
      - metarr-data:/app/data
      # Same bind as the host path, like other containers on this VM.
      - /mnt/media:/mnt/media
    restart: unless-stopped

volumes:
  metarr-data:
