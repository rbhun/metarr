services:
  metarr:
    build: .
    ports:
      - "4317:4317"
    environment:
      PORT: "4317"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /app/data/library.db
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      # Dedicated media user and group; see metarr.env.example.
      METARR_UID: "${METARR_UID:-1500}"
      METARR_GID: "${METARR_GID:-1002}"
      UMASK: "${UMASK:-002}"
      METARR_DRY_RUN: "${METARR_DRY_RUN:-0}"
      # Remux and retag work files. On the NAS, outside every library folder, so Plex and the *arr apps never see them.
      METARR_SCRATCH: "${METARR_SCRATCH:-/mnt/media/.metarr-work}"
    # Low CPU weight so Plex playback transcodes always win; tools also run under ionice -c3 / nice 19.
    cpu_shares: 128
    volumes:
      - metarr-data:/app/data
      - /mnt/media:/mnt/media
    restart: unless-stopped

volumes:
  metarr-data:
