services:
  metarr:
    build: .
    ports:
      - "4317:4317"
    environment:
      PORT: "4317"
      HOSTNAME: "0.0.0.0"
      DATABASE_PATH: /app/data/library.db
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - metarr-data:/app/data
    restart: unless-stopped

volumes:
  metarr-data:
